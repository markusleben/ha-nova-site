name: README sync

# hanova.app must always match the product README (markusleben/ha-nova).
# Daily + on every push: scripts/check-sync.sh against the live README; a
# scheduled failure opens (or comments on) one tracking issue.

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the page with the product README
        id: check
        run: |
          set -o pipefail
          curl -fsS --retry 3 -o "$RUNNER_TEMP/README.md" \
            https://raw.githubusercontent.com/markusleben/ha-nova/main/README.md
          bash scripts/check-sync.sh "$RUNNER_TEMP/README.md" 2>&1 | tee "$RUNNER_TEMP/sync.log"

      - name: Open or update the tracking issue
        if: failure() && steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Site out of sync with the product README"
          body="$(printf '%s\n\n```text\n%s\n```\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$(cat "$RUNNER_TEMP/sync.log")")"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
